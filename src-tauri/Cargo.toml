[package]
name = "zuno"
version = "0.1.0"
description = "Zuno — Less noise. More web."
authors = ["Zuno"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "zuno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["unstable", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2.5.8"
parking_lot = "0.12.5"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
base64 = "0.23.1"
sha2 = "0.11.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "form", "charset", "http2"] }
getrandom = "0.3"

[target."cfg(windows)".dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
